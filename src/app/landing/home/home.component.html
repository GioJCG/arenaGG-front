<div class="landing-container">
  <app-header></app-header>

  <main class="main-content">
    <div class="content-wrapper">
      <!-- 🔧 Agrupamos imagen + stats en una columna vertical -->
      <div class="image-column">
        <div class="image-and-stats">
          <img src="../../../assets/images/Landing_image.png" alt="Imagen landing" class="featured-image">

          
          <section class="status-section">
            <app-tournament-card
              [showStats]="true"
              [statsHeld]="stats.tournamentsHeld"
              [statsPlayers]="stats.registeredPlayers">
            </app-tournament-card>
          </section>
        </div>
      </div>

      <!-- Columna de contenido -->
      <div class="content-column">
        <section class="hero">
          <!-- Opcional -->
        </section>

        <section class="tournaments-section"> 
          <h2>NEXT TOURNAMENTS</h2>
          
          <app-tournament-card
            *ngFor="let tournament of tournaments"
            [game]="tournament.game"
            [title]="tournament.title" 
            [date]="tournament.date"
            [prize]="tournament.prize">
          </app-tournament-card>

        </section>
      </div>
    </div>
  </main>

  <app-footer></app-footer>
</div>
